# Cluster runtime (service-runtime spec). Included by application.conf. A single
# replica still forms a cluster of one; multi-replica forms via Management + Bootstrap
# config discovery. This file sets the actor provider to `cluster` — the one behavior
# change local dev sees vs. the earlier `local` provider.

pekko {
  actor.provider = "cluster"

  remote.artery.canonical {
    hostname = "127.0.0.1"
    hostname = ${?CLUSTER_HOST}
    port = 25520
    port = ${?CLUSTER_PORT}
  }

  cluster {
    # A lone node forms a cluster of one; the homelab target is >=3 for keep-majority quorum.
    min-nr-of-members = 1
    min-nr-of-members = ${?CLUSTER_MIN_MEMBERS}

    # Split-brain resolver is mandatory (keep-majority).
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    split-brain-resolver.active-strategy = "keep-majority"

    sharding.number-of-shards = 256
    sharding.number-of-shards = ${?CLUSTER_NUMBER_OF_SHARDS}
  }
}

# Number of distributed projection instances (slice-range workers spread across the cluster).
artemis.projection.instances = 4
artemis.projection.instances = ${?PROJECTION_INSTANCES}

pekko.management {
  http {
    hostname = "127.0.0.1"
    hostname = ${?MANAGEMENT_HOST}
    port = 8558
    port = ${?MANAGEMENT_PORT}
  }
  cluster.bootstrap.contact-point-discovery {
    service-name = "artemis"
    # config (static, compose) by default; override to kubernetes-api / dns in k8s.
    discovery-method = "config"
    discovery-method = ${?DISCOVERY_METHOD}
    required-contact-point-nr = 1
    required-contact-point-nr = ${?REQUIRED_CONTACT_POINTS}
  }
}

# Config-discovery contact point. Defaults to this node's own management endpoint, so a
# lone node bootstraps a cluster of one. For a multi-node deployment, point
# CONTACT_POINT_HOST at the headless service so peers discover each other.
pekko.discovery.config.services.artemis.endpoints = [
  {
    host = "127.0.0.1"
    host = ${?CONTACT_POINT_HOST}
    port = 8558
    port = ${?MANAGEMENT_PORT}
  }
]
