# Event journal: PostgreSQL via pekko-persistence-r2dbc. Connection parameters
# default for local/compose and are overridable by environment variables — no
# credentials committed. Included by application.conf; unit tests use the
# in-memory persistence testkit journal, integration tests override the host/port
# to point at a testcontainers Postgres.

pekko.persistence {
  journal.plugin = "pekko.persistence.r2dbc.journal"
  snapshot-store.plugin = "pekko.persistence.r2dbc.snapshot"
}

pekko.persistence.r2dbc {
  dialect = "postgres"

  connection-factory {
    driver = "postgres"

    host = "localhost"
    host = ${?POSTGRES_HOST}
    port = 5432
    port = ${?POSTGRES_PORT}
    database = "artemis"
    database = ${?POSTGRES_DB}
    user = "artemis"
    user = ${?POSTGRES_USER}
    password = "artemis"
    password = ${?POSTGRES_PASSWORD}

    # Fail fast rather than hang when Postgres is unreachable at startup.
    connect-timeout = 3 seconds
    connect-timeout = ${?POSTGRES_CONNECT_TIMEOUT}
    acquire-retry = 2
  }
}
