# Event serialization (Jackson CBOR). Shared by main and test config via
# `include "serialization"`. The domain marker trait is bound to the CBOR
# serializer, and the custom module teaches the mapper the pure-domain value
# types + the polymorphic Post/Pool event ADTs.

pekko.actor {
  serialization-bindings {
    "me.cference.artemis.domain.CborSerializable" = jackson-cbor
  }
}

pekko.serialization.jackson {
  jackson-modules += "me.cference.artemis.persistence.DomainJacksonModule"
}
