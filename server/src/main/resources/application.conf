# Artemis runtime configuration. Every deployment-varying value is overridable by
# an environment variable; no secrets are committed here.

include "serialization"
include "persistence"
# Cluster runtime: sets the actor provider to `cluster`, hosts sharded entities, and
# forms a cluster (of one by default) via management + config discovery.
include "cluster"

pekko {
  loglevel = "INFO"
  loglevel = ${?LOG_LEVEL}
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  # Run Coordinated Shutdown (and exit the JVM) on SIGTERM.
  coordinated-shutdown.run-by-jvm-shutdown-hook = on
  coordinated-shutdown.exit-jvm = on

  # The actor provider is set to `cluster` by cluster.conf (included above).
}

# HTTP API surface (health, metrics, search, catalog, media gateway). Bound by Main.
artemis.http {
  host = "0.0.0.0"
  host = ${?HTTP_HOST}
  port = 8080
  port = ${?HTTP_PORT}
}

# Runtime loop intervals and the startup readiness probe (service-runtime spec).
artemis.runtime {
  # How often the Hermes consume loop pulls each result subscription.
  consume-interval = 2 seconds
  consume-interval = ${?CONSUME_INTERVAL}
  # How often the in-memory tag-graph cache reloads from Postgres (bounded staleness).
  tag-graph-refresh = 60 seconds
  tag-graph-refresh = ${?TAG_GRAPH_REFRESH}
  # Startup Postgres readiness probe: bounded retries before aborting the boot.
  readiness-retries = 5
  readiness-retries = ${?READINESS_RETRIES}
  readiness-retry-delay = 1 second
  readiness-retry-delay = ${?READINESS_RETRY_DELAY}
}

# Apollo object store gRPC endpoint (consumed by ApolloObjectClient). Defaults suit
# local/compose; every value is env-overridable — no endpoint committed.
artemis.apollo {
  host = "localhost"
  host = ${?APOLLO_HOST}
  port = 8443
  port = ${?APOLLO_PORT}
  tls = false
  tls = ${?APOLLO_TLS}
}

# HermesMQ pub/sub gRPC endpoint (consumed by HermesClient) and the media-contract
# channel names. Artemis publishes ProcessMediaJob to topic-media-process and consumes
# MediaProcessed / MediaFailed from the two subscriptions. Defaults suit local/compose;
# every value is env-overridable — no endpoint or channel name committed.
artemis.hermes {
  host = "localhost"
  host = ${?HERMES_HOST}
  port = 8450
  port = ${?HERMES_PORT}
  tls = false
  tls = ${?HERMES_TLS}
  topic-media-process = "media.process"
  topic-media-process = ${?HERMES_TOPIC_MEDIA_PROCESS}
  sub-media-processed = "artemis.media.processed"
  sub-media-processed = ${?HERMES_SUB_MEDIA_PROCESSED}
  sub-media-failed = "artemis.media.failed"
  sub-media-failed = ${?HERMES_SUB_MEDIA_FAILED}
  # Auto-tagging: Artemis publishes TagJob to topic-media-tag (Argus consumes it) and consumes
  # Argus's TagSuggestions from sub-tags-suggested.
  topic-media-tag = "media.tag"
  topic-media-tag = ${?HERMES_TOPIC_MEDIA_TAG}
  sub-tags-suggested = "artemis.media.tags.suggested"
  sub-tags-suggested = ${?HERMES_SUB_TAGS_SUGGESTED}
}

# Post-processing near-duplicate detection: the max phash Hamming distance for a newly
# active post to be flagged a possible duplicate of an existing one. Env-overridable.
artemis.dedup {
  hamming-threshold = 10
  hamming-threshold = ${?DEDUP_HAMMING_THRESHOLD}
}

# Deletion lifecycle (deletion-lifecycle spec): soft-deleted posts auto-purge after `retention`
# (blobs deleted 1:1); the retention job scans every `purge-interval`. Env-overridable.
artemis.gc {
  retention = 30 days
  retention = ${?GC_RETENTION}
  purge-interval = 1 hour
  purge-interval = ${?GC_PURGE_INTERVAL}
}

# Reprocessing (processing-versions + reprocess-orchestration): the CURRENT derivative-spec and
# tagger generation numbers — bump one when you change how derivatives/tags are generated, then run
# a `stale` reprocess to backfill. Reprocess jobs go to the lower-priority backfill lanes (distinct
# from the ingest topics); `max-select` caps one reprocess. Env-overridable.
#
# ORDERING (important): the stamp written to a post is what Hephaestus/Argus report at process
# time, but the `stale` threshold is these config numbers. So DEPLOY the new worker FIRST, THEN
# bump the matching version here. Bumping ahead of the worker makes every post read `stale`
# forever (each re-run re-stamps the OLD value) — the backfill never converges.
artemis.reprocess {
  derivative-spec-version = 1
  derivative-spec-version = ${?REPROCESS_DERIVATIVE_SPEC_VERSION}
  tagger-version = 1
  tagger-version = ${?REPROCESS_TAGGER_VERSION}
  topic-reprocess = "media.reprocess"
  topic-reprocess = ${?HERMES_TOPIC_MEDIA_REPROCESS}
  topic-tag-reprocess = "media.tag.reprocess"
  topic-tag-reprocess = ${?HERMES_TOPIC_MEDIA_TAG_REPROCESS}
  max-select = 10000
  max-select = ${?REPROCESS_MAX_SELECT}
}
