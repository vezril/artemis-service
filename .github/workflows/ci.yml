name: CI

# Verifies every pull request targeting development or main: formatting, static analysis
# (scalafix as a gate + cranked -W flags under -Werror), compilation, the full test suite
# with a coverage report, and a secret scan. Merging is blocked unless the required checks
# pass (branch protection).
on:
  pull_request:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token for resolving the Lexicon jars from GitHub Packages (Maven reads need auth
# even for public packages; the built-in token can't read another repo's package). Supply a
# read:packages PAT as the LEXICON_TOKEN repo secret — without it the build cannot resolve
# io.codex:lexicon-* and every sbt job fails at dependency resolution.
env:
  LEXICON_TOKEN: ${{ secrets.LEXICON_TOKEN }}

jobs:
  # Formatting is a separate job so a scalafmt violation fails independently of the tests
  # (a green test suite must not mask a format failure).
  format:
    name: Format (scalafmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-scala
      - name: Check formatting
        run: sbt -batch scalafmtCheckAll scalafmtSbtCheck

  # Static analysis: scalafix as a CI gate (DisableSyntax + OrganizeImports, semantic — needs
  # SemanticDB, enabled in build.sbt). The -Werror + cranked -W flags are enforced by `compile`
  # in the build-test job, so a warning there already fails the build.
  lint:
    name: Static analysis (scalafix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-scala
      - name: scalafix --check
        run: sbt -batch "scalafixAll --check"

  build-test:
    name: Compile, test & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # sbt-dynver needs full history + tags
      - uses: ./.github/actions/setup-scala
      - name: Compile (warnings are errors — static-analysis)
        run: sbt -batch compile Test/compile
      # Coverage is REPORTED, not gated (no coverageMinimumStmtTotal floor yet — see the
      # static-analysis spec). testcontainers uses the runner's Docker daemon.
      - name: Test with coverage
        run: sbt -batch clean coverage test coverageAggregate
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoverage-report
          path: target/scala-*/scoverage-report/
          if-no-files-found: warn

  # Secret scan: fails on any committed credential in the repo or its history.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so a secret in an old commit is still caught
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # sbt-dynver sanity: an untagged commit must yield a snapshot (non-releasable) version so
  # releases can only come from an explicit tag.
  version-check:
    name: Version derivation (dynver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-scala
      - name: Assert untagged build is a snapshot
        run: |
          VERSION=$(sbt -Dsbt.log.noformat=true -batch -error 'print version' | tail -n1 | perl -pe 's/\e\[[0-9;]*[a-zA-Z]//g' | tr -d '[:space:]')
          echo "Derived version: $VERSION"
          case "$VERSION" in
            *SNAPSHOT*|*-*-*) echo "OK: snapshot version" ;;
            *) echo "ERROR: untagged build produced a clean release version '$VERSION'"; exit 1 ;;
          esac
